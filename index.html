<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio Da DayDay</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(135deg, #BFEFFF, #fff); /* azul bebê */
      color: #4682B4; /* azul médio */
      margin: 0;
      padding: 0;
      animation: fadeIn 2s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    header {
      background-color: #ADD8E6; /* azul bebê */
      padding: 20px;
      text-align: center;
      border-bottom: 5px solid #4682B4; /* azul médio */
      animation: pulse 3s infinite;
    }

    header h1 {
      margin: 0;
      color: #fff;
      text-shadow: 2px 2px #4682B4;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); color: #E0FFFF; }
      100% { transform: scale(1); }
    }

    .materia {
      margin: 30px 42px;
    }

    .materia h2 {
      color: #4682B4;
      margin-bottom: 15px;
      border-bottom: 3px dashed #ADD8E6;
      padding-bottom: 5px;
      font-style: italic;
    }

    .tarefas {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .tarefa {
      flex: 1;
      background-color: #E0FFFF; /* azul clarinho */
      border: 2px solid #ADD8E6;
      border-radius: 15px;
      text-align: center;
      padding: 15px;
      transition: transform 0.4s, box-shadow 0.4s;
      position: relative;
    }

    .tarefa:hover {
      transform: scale(1.1) rotate(-2deg);
      box-shadow: 0 0 20px #ADD8E6;
    }

    .tarefa a {
      color: #4682B4;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }

    .tarefa a:hover {
      color: #004080;
    }

    footer {
      background-color: #ADD8E6;
      position: fixed;
      bottom: 0;
      width: 100%;
      padding: 1%;
      text-align: center;
      color: #004080;
      font-weight: bold;
      border-top: 3px solid #4682B4;
    }

    /* Efeito de corações subindo */
    @keyframes floatHearts {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
    }

    .heart {
      position: fixed;
      bottom: 10px;
      font-size: 24px;
      color: #4682B4; /* corações em azul */
      animation: floatHearts 4s linear infinite;
    }
  </style>
</head>
<body>
  <header>
    <h1>Portfólio Da DayDay</h1>
  </header>

  <footer>
    <p>© 2026 - Desenvolvido por Dayellenn com amor 💙</p>
  </footer>

  <script>
    // Criar corações animados
    setInterval(() => {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "💙"; // coração azul
      heart.style.left = Math.random() * window.innerWidth + "px";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 4000);
    }, 1000);

    // Mensagem divertida ao clicar
    document.querySelectorAll('.tarefa a').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        alert(`💙 Você escolheu: ${link.textContent} 💙`);
      });
    });
  </script>
</body>
</html>
