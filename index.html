<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Apresentação</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      text-align: center;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    .logo-container {
      margin-top: 20px;
      text-align: center;
      animation: fadeIn 2s ease-in-out;
    }

    .logo {
      width: 200px;
      border: 6px solid #fff;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      animation: slideDown 1.5s ease-in-out;
    }

    .school-name {
      margin-top: 10px;
      font-size: 1.4em;
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 6px rgba(0,0,0,0.4);
    }

    h1 {
      font-size: 3em;
      animation: pulse 2s infinite;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
      margin-top: 30px;
    }

    button {
      margin-top: 20px;
      padding: 15px 40px;
      font-size: 1.2em;
      border: none;
      border-radius: 30px;
      background: linear-gradient(135deg, #fff, #e0e0e0);
      color: #2575fc;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    button:hover {
      transform: scale(1.1);
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    .apresentacao {
      display: none;
      animation: slideUp 1.5s ease-in-out;
    }

    .links {
      margin-top: 30px;
    }

    .links button {
      margin: 10px;
      padding: 12px 25px;
      background: #fff;
      color: #2575fc;
      border-radius: 25px;
      font-weight: bold;
      transition: all 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .links button:hover {
      background: #2575fc;
      color: #fff;
      transform: translateY(-5px);
    }

    iframe {
      margin-top: 20px;
      width: 90%;
      height: 500px;
      border: none;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      display: none;
    }

    .sobre-mim {
      display: none;
      margin-top: 20px;
      font-size: 1.1em;
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes slideUp {
      from { transform: translateY(100px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes slideDown {
      from { transform: translateY(-50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Logo e nome da escola centralizados -->
  <div class="logo-container">
    <img src="../Colégio-Unidade-Polo-.jpeg" alt="Logo da Escola" class="logo">
    <div class="school-name">Colégio Unidade Polo</div>
  </div>

  <div class="container" id="welcome">
    <h1> Bem-vindo! </h1>
    <button onclick="entrar()">Entrar</button>
  </div>

  <div class="apresentacao" id="apresentacao">
    <h1>🚀 Bem vindo!</h1>
    <p>Aqui você encontra meus links e contatos!</p>
    <div class="links">
      <button onclick="abrirLink('https://www.linkedin.com/in/dayellenn-fernanda-82a08830a?utm_source=share_via&utm_content=profile&utm_medium=member_android')">LinkedIn</button>
      <button onclick="abrirLink('https://dayday-13.github.io/portfolio/')">Portfólio</button>
    </div>
    <iframe id="iframeLink"></iframe>
    <button onclick="mostrarSobre()">Sobre mim</button>
    <div class="sobre-mim" id="sobre">
      <p>Olá visitante! Meu nome é Dayellenn Fernanda. Sou estudante no Colégio Unidade Polo e aqui compartilho meus projetos, portfólio e formas de contato. Seja bem-vindo(a)!</p>
    </div>
  </div>

  <script>
    function entrar() {
      document.getElementById('welcome').style.display = 'none';
      document.getElementById('apresentacao').style.display = 'block';
    }

    function mostrarSobre() {
      const sobre = document.getElementById('sobre');
      sobre.style.display = (sobre.style.display === 'none' || sobre.style.display === '') ? 'block' : 'none';
    }

    function abrirLink(url) {
      const iframe = document.getElementById('iframeLink');
      iframe.src = url;
      iframe.style.display = 'block';
    }
  </script>
</body>
</html>
